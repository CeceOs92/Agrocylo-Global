# Standalone Redis service for agro-production/server
# Used for persistent Redis storage with appendonly mode (durability)
# Note: This repo's primary dev workflow uses npm run dev, not full Docker orchestration
# See ../../README.md "Docker Setup" section for details
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  redis_data:

