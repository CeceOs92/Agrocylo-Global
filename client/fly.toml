# fly.toml — Root marketplace client (Next.js)
# Fly.io app: agrocylo-client (prod) / agrocylo-client-staging (staging)

app = "agrocylo-client"
primary = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
